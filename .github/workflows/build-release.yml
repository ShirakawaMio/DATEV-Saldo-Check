name: Test, build, and release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --group build
      - name: Run logic tests
        run: uv run python tests/test_check_saldo.py

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos
            architecture: arm64
            python_arch: arm64
          - os: windows-latest
            platform: windows
            architecture: x86
            python_arch: x86
          - os: ubuntu-22.04
            platform: linux
            architecture: x64
            python_arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: ${{ matrix.python_arch }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --group build
      - name: Build GUI package
        run: uv run python build_release.py --target gui
      - name: Upload platform package
        uses: actions/upload-artifact@v4
        with:
          name: check-saldo-${{ matrix.platform }}-${{ matrix.architecture }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: check-saldo-*
          path: release-assets
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="build-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" release-assets/*.zip \
            --target "$GITHUB_SHA" \
            --title "check-saldo $tag" \
            --notes "Automated packages built from main at $GITHUB_SHA."
